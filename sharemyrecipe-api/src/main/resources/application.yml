spring:
  application:
    name: sharemyrecipe-api

  datasource:
    url: jdbc:postgresql://localhost:5432/sharemyrecipe
    username: smr_user
    password: smr_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: smr_user
    password: smr_pass

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 40MB

server:
  port: 8080

app:
  jwt:
    secret: 'change-me-in-production-must-be-at-least-32-chars'
    access-ttl-ms: 900000 # 15 minutes
    refresh-ttl-ms: 604800000 # 7 days
  upload:
    dir: ./uploads
  email-verification-enabled: false
  pagination:
    default-page-size: 20
    max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

logging:
  level:
    com.sharemyrecipe: DEBUG
    org.springframework.security: INFO
