spring:
  application:
    name: sharemyrecipe-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/sharemyrecipe
    username: smr_user
    password: smr_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: smr_user
    password: smr_pass
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2
          max-interval: 30000
        acknowledge-mode: auto

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sharemyrecipe: DEBUG
